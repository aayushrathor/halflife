<svg width="1200" height="630" viewBox="0 0 1200 630" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="12" dy="12" stdDeviation="0" flood-color="#000"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#FFDE59"/>

  <rect x="24" y="24" width="1152" height="582" fill="#FFDE59" stroke="#000" stroke-width="6" filter="url(#shadow)"/>

  <rect x="48" y="48" width="1104" height="534" fill="none" stroke="#000" stroke-width="3"/>

  <g transform="translate(600,160)" stroke="#000" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <ellipse cx="0" cy="0" rx="56" ry="20" stroke-dasharray="8 6"/>
    <ellipse cx="0" cy="0" rx="56" ry="20" transform="rotate(60)" stroke-dasharray="8 6"/>
    <ellipse cx="0" cy="0" rx="56" ry="20" transform="rotate(120)" stroke-dasharray="8 6"/>
    <circle cx="-18" cy="-12" r="14" fill="#000" stroke="none"/>
    <circle cx="18" cy="-12" r="14" fill="#000" stroke="none"/>
    <circle cx="-10" cy="14" r="14" fill="#000" stroke="none"/>
    <circle cx="10" cy="14" r="14" fill="#000" stroke="none"/>
    <circle cx="0" cy="0" r="8" fill="#FFDE59" stroke="#000" stroke-width="3"/>
    <circle cx="56" cy="0" r="9" fill="#000" stroke="none"/>
    <circle cx="-20" cy="52" r="9" fill="#000" stroke="none"/>
    <circle cx="-20" cy="-52" r="9" fill="#000" stroke="none"/>
  </g>

  <text x="600" y="290" text-anchor="middle" font-family="'Arial Black',Arial,Helvetica,sans-serif" font-size="130" font-weight="900" fill="#000">HALFLIFE</text>

  <line x1="200" y1="340" x2="1000" y2="340" stroke="#000" stroke-width="4"/>

  <text x="600" y="380" text-anchor="middle" font-family="Arial,Helvetica,sans-serif" font-size="36" font-weight="700" fill="#000">radioactive decay, but it's your lifespan</text>

  <rect x="340" y="420" width="520" height="60" fill="#B6F84A" stroke="#000" stroke-width="4" filter="url(#shadow)"/>
  <text x="600" y="460" text-anchor="middle" font-family="'Courier New',monospace" font-size="22" font-weight="700" fill="#000">N(t) = N₀ · e^(-λt)</text>
</svg>
